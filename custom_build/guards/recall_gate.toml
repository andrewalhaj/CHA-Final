# Past-work and open-work question patterns. Ship in log mode and review results before enforcement.
mode = "log"

[past_work]
what_did = '''(?i)\bwhat\s+did\s+(?:we|i)\s+(?:decide|say|agree|choose|pick|find|change|conclude|settle|land)\b'''
did_we = '''(?i)\b(?:did|have|had)\s+we\s+(?:already\s+|ever\s+)?(?:decide|decided|discuss|discussed|talk|talked|agree|agreed|settle|settled|try|tried|fix|fixed|change|changed|pin|pinned)\b'''
seen_before = '''(?i)\b(?:have|did)\s+we\s+(?:seen|hit|had|run\s+into)\b[^.?!\n]{0,60}?\b(?:before|previously)\b'''
negated = '''(?i)\b(?:didn['’]?t|haven['’]?t|weren['’]?t|wasn['’]?t)\s+we\b'''
working_on = '''(?i)\bwhat\s+(?:were|was)\s+(?:we|i)\s+(?:working\s+on|doing)\b'''
where_were_we = '''(?i)\bwhere\s+were\s+we\s*[?.!？。”"’]*\s*$|\bwhere\s+did\s+we\s+(?:leave|stop)\s+off\b|\bwhere\s+we\s+left\s+off\b|\bwe\s+(?:left|leave)\s+off\s*[?.!？。”"’,]'''
remind_me = '''(?i)\bremind\s+me\s+(?:what|how|why|where|when|which)\s+(?:we|i)\b'''
remember = '''(?i)\b(?:do|can|did)\s+you\s+(?:still\s+)?(?:remember|recall)\s+(?:when|(?:what|how|why|where|which|that)\s+(?:we|i)\b|the\s+[\w -]{1,30}?\s+(?:we|i)\b)|^\W*remember\s+(?:when|(?:what|how|why|where|that)\s+(?:we|i)\b|the\s+[\w -]{1,30}?\s+(?:we|i)\b)'''
last_time = '''(?i)\b(?:we|i)\b[^.?!\n]{0,60}\b(?:last\s+time|last\s+session|previous\s+session|earlier|before|yesterday|previously)\b[^.?!\n]{0,15}\?'''

# Open work: the whole message is the question, after at most a short lead-in ("great, thanks."), with at
# most a short "on/from/before ..." tail, so "what is open on port 5432?" or "explain what next() does" do not
# count. Each ends in at most closing punctuation, straight or curly quotes, or a full-width mark.
[open_work]
left = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what(?:['’]?s|\s+is|\s+are)?\s+(?:still\s+)?(?:left|remaining|outstanding)(?:\s+to\s+(?:do|be\s+done))?(?:\s+(?:on|from|before)\s+[\w .'’-]{1,30}|\s+for\s+(?:us|me|today|now))?\s*[?.!？。”"’]*\s*$'''
else_left = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what\s+else\s+(?:is|are)\s+(?:still\s+)?(?:left|remaining)(?:\s+to\s+do)?\s*[?.!？。”"’]*\s*$'''
still_to_do = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what(?:['’]?s|\s+is|\s+are)?\s+(?:still\s+)?(?:left\s+)?to\s+(?:do|be\s+done)(?:\s+(?:on|from|before)\s+[\w .'’-]{1,30})?\s*[?.!？。”"’]*\s*$'''
remains = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what\s+(?:else\s+)?(?:still\s+)?remains(?:\s+to\s+(?:do|be\s+done))?\s*[?.!？。”"’]*\s*$'''
next = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what(?:['’]?s|s|\s+is|\s+are)?\s+(?:the\s+|our\s+)?(?:up\s+)?next(?:\s+steps?)?\s*[?.!？。”"’]*\s*$'''
next_steps = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}next\s+steps?\s*[?.!？。”"’]*\s*$'''
pending = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what(?:['’]?s|\s+is|\s+are)\s+(?:still\s+)?pending\s*[?.!？。”"’]*\s*$'''
remaining_tasks = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what\s+are\s+the\s+remaining\s+(?:tasks|items|steps)\s*[?.!？。”"’]*\s*$'''
still_needs = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what\s+still\s+needs\s+(?:doing|to\s+be\s+done)\s*[?.!？。”"’]*\s*$'''
anything_left = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}(?:is\s+there\s+)?anything\s+(?:else\s+)?(?:left|remaining)(?:\s+to\s+do)?\s*[?.!？。”"’]*\s*$'''
still_need = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what\s+do\s+(?:we|i)\s+still\s+(?:need|have)\s+to\s+do\s*[?.!？。”"’]*\s*$'''
open_items = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}(?:(?:any|are\s+there(?:\s+any)?)\s+)?(?:the\s+)?open\s+items(?:\s+(?:on|from)\s+[\w .'’-]{1,30})?\s*[?.!？。”"’]*\s*$'''
todo_list = '''(?i)^\W*(?:(?:so|ok|okay|and|then|alright|great|thanks|cool|nice|perfect)\W+){0,3}what(?:['’]?s|\s+is)\s+on\s+(?:the|our|my)\s+to-?do\s+list\s*[?.!？。”"’]*\s*$'''
