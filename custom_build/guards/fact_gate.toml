# ARCHITECTURE.md section 5.3. Ship in log mode; on adds a reminder and holds unchecked replies.
mode = "log"

# Lookup tools: each returns something looked up in that turn, a page, a file, a command's result or a past
# session (CONTRIBUTING.md section 2, goal 2). Counted only when post_tool_call reports them ok (#22, #31).
# delegate_task counts because a subagent's own lookups carry its session and turn, not the parent's.
# memory_search, the memory track's search tool, joined with it (#158).
lookups = ["web_search", "web_extract", "read_file", "search_files", "terminal", "session_search", "skill_view", "x_search", "delegate_task", "memory_search"]

# Documentation lookups: vendor documentation is read on the web.
documentation = ["web_search", "web_extract"]

# Checkable questions: case-insensitive patterns on the user's message, tried in this order; the first that
# matches names the turn. Each asks for a fact a tool can check and the agent would otherwise answer from memory.
[questions]
# state and support read "is" and "does" only where a sentence starts, as a question does.
version = '''\b(?:which|what)\s+(?:[\w.-]+\s+)?version\b|\blatest\s+(?:version|release)\b'''
location = '''\bwhere\s+(?:is|are|does|do)\b'''   # before state: "where is X installed" asks a place
state = '''(?m)(?:^|[.!?]\s+)is\s+(?:the\s+|my\s+|our\s+|it\s+)?(?:[\w.-]+\s+){1,3}(?:running|up|down|open|listening|enabled|disabled|installed|set|configured|reachable)\b'''
value = '''\bwhat(?:'s|\s+is|\s+are)\s+(?:the\s+)?(?:current\s+)?(?:value|setting|status|state|limit|default|size|price|cost)\b'''
count = '''\bhow\s+(?:many|much)\b'''
support = '''(?m)(?:^|[.!?]\s+)does\s+(?:[\w.-]+\s+){1,3}support\b'''
date = '''\bwhen\s+(?:is|was|did|does|will)\b'''
error = '''(?s)\A(?=.*\?)(?=.*\b(?:errors?|exceptions?|tracebacks?|fail(?:s|ed|ing|ures?)?)\b)'''   # a question naming a failure; anchored, so it reads the message once

# A reply that needs a documentation lookup too: case-insensitive patterns on an armed turn's reply.
[needs_documentation]
procedure = '''(?m)^[ \t]*(?:step\s+)?2[.):]\s'''   # a second numbered step; [ \t], so blank lines are read once
diagnosis = '''\b(?:root cause|the cause is|is caused by|this happens because|the problem is)\b'''
