name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
        env:  # Job-scoped credentials for the disposable service.
          POSTGRES_USER: cha_final_ci
          POSTGRES_PASSWORD: cha_final_ci
          POSTGRES_DB: cha_final_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cha_final_ci -d cha_final_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHA_FINAL_TEST_DATABASE_URL: postgresql://cha_final_ci:cha_final_ci@127.0.0.1:5432/cha_final_test?connect_timeout=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 0 }   # the secret scan reads the whole history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with: { python-version: "3.14" }
      - name: install gitleaks 8.30.1, checked against its published checksum
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: no secret in the repository's history
        shell: bash
        run: |
          command -v gitleaks >/dev/null || { echo "secret scan: gitleaks is not installed"; exit 1; }
          errors=$(mktemp)
          # Findings, redacted, go to stdout; at this log level only gitleaks's errors go to stderr.
          # --diff-merges=remerge also shows what a merge commit itself brings in.
          set +e
          gitleaks git --redact --no-banner -v --log-level error --exit-code 1 \
            --log-opts="--full-history --all --diff-filter=tuxdb --diff-merges=remerge" . 2>"$errors"
          code=$?
          set -e
          # gitleaks exits 0 when git itself fails: that is no scan, not a clean history.
          if [ -s "$errors" ]; then
            cat "$errors"
            echo "secret scan: gitleaks reported an error, so the history was not scanned"
            exit 1
          fi
          [ "$code" -eq 0 ] || { echo "secret scan: gitleaks found a secret (above, redacted)"; exit "$code"; }
      - name: install pinned runtime and lint dependencies
        run: python -m pip install 'psycopg[binary]==3.3.9' 'ruff==0.17.4'
      - name: verify disposable PostgreSQL connectivity
        shell: bash
        run: |
          python - <<'PY'
          import os

          import psycopg

          with psycopg.connect(os.environ["CHA_FINAL_TEST_DATABASE_URL"]) as connection:
              if connection.execute("SELECT 1").fetchone() != (1,):
                  raise SystemExit("Disposable PostgreSQL did not return the expected result")
          PY
      - run: ruff check .
      - run: python -B -m unittest discover -s tests -v
